#cloud-config
# Dedicated Debian 13 control VM only. Installs Docker; exposes no lab web port.
package_update: true
packages:
  - ca-certificates
  - curl
  - gnupg
write_files:
  - path: /usr/local/sbin/install-mini-quiz-control-runtime
    owner: root:root
    permissions: '0700'
    content: |
      #!/usr/bin/env bash
      set -euo pipefail
      . /etc/os-release
      test "${ID}" = debian && test "${VERSION_CODENAME}" = trixie
      test "$(dpkg --print-architecture)" = amd64
      install -m 0755 -d /etc/apt/keyrings
      curl --fail --silent --show-error --location \
        https://download.docker.com/linux/debian/gpg \
        -o /etc/apt/keyrings/docker.asc
      chmod 0644 /etc/apt/keyrings/docker.asc
      cat >/etc/apt/sources.list.d/docker.sources <<'EOF'
      Types: deb
      URIs: https://download.docker.com/linux/debian
      Suites: trixie
      Components: stable
      Architectures: amd64
      Signed-By: /etc/apt/keyrings/docker.asc
      EOF
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
        'docker-ce=5:29.8.2-1~debian.13~trixie' \
        'docker-ce-cli=5:29.8.2-1~debian.13~trixie' \
        'containerd.io=2.3.6-1~debian.13~trixie' \
        'docker-buildx-plugin=0.37.1-1~debian.13~trixie' \
        'docker-compose-plugin=5.5.1-1~debian.13~trixie'
      systemctl enable --now docker
      docker version --format '{{.Server.Version}}' | grep -Fx 29.8.2
      docker compose version --short | grep -Fx 5.5.1
      install -d -m 0700 /opt/mini-quiz-lab
runcmd:
  - [bash, /usr/local/sbin/install-mini-quiz-control-runtime]

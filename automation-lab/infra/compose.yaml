name: mini-quiz-lab
services:
  postgres:
    image: postgres:16.10-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: coder
      POSTGRES_USER: coder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder -d coder"]
      interval: 10s
      timeout: 5s
      retries: 10
  coder:
    image: ghcr.io/coder/coder:v2.36.6
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      CODER_PG_CONNECTION_URL: postgresql://coder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/coder?sslmode=disable
      CODER_HTTP_ADDRESS: 0.0.0.0:7080
      CODER_ACCESS_URL: https://${LAB_DOMAIN:?set LAB_DOMAIN}
      CODER_WILDCARD_ACCESS_URL: '*.${LAB_DOMAIN:?set LAB_DOMAIN}'
      CODER_DISABLE_PATH_APPS: 'true'
      CODER_DISABLE_WORKSPACE_SHARING: 'true'
      CODER_DISABLE_OWNER_WORKSPACE_ACCESS: 'true'
      CODER_TELEMETRY_ENABLE: 'false'
      CODER_OAUTH2_GITHUB_DEFAULT_PROVIDER_ENABLE: 'false'
      CODER_OAUTH2_GITHUB_ALLOW_SIGNUPS: 'false'
      CODER_OIDC_ALLOW_SIGNUPS: 'false'
      DIGITALOCEAN_TOKEN: ${DIGITALOCEAN_TOKEN:?set DIGITALOCEAN_TOKEN}
    networks: [backend]
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - coder_home:/home/coder
    security_opt:
      - no-new-privileges:true
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on: [coder]
    environment:
      LAB_DOMAIN: ${LAB_DOMAIN:?set LAB_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [backend]
    security_opt:
      - no-new-privileges:true
networks:
  backend:
    internal: false
volumes:
  postgres_data:
  coder_home:
  caddy_data:
  caddy_config:
